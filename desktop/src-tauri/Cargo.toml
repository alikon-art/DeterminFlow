[package]
name = "determinflow-desktop"
version = "1.0.9"
description = "DeterminFlow desktop shell"
authors = ["DeterminFlow Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
